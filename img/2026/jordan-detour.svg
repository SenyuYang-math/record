<rect x="292.0" y="232.0" width="156.0" height="132.0" fill="#ffffff" stroke="#2b4fc0" stroke-width="2"/>
<rect x="448.0" y="232.0" width="104.0" height="44.0" fill="#f6c9c9" stroke="#c0392b" stroke-width="2"/>
