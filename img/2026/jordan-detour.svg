<text x="344.0" y="117.6" font-size="19" fill="#111" text-anchor="middle" font-style="italic">C</text>
<text x="208.8" y="170.4" font-size="18" fill="#111" text-anchor="middle">U</text>
<text x="370.0" y="304.6" font-size="17" fill="#2b4fc0" text-anchor="middle" font-style="italic">T</text>
<text x="520.8" y="254.0" font-size="16" fill="#c0392b" text-anchor="middle" font-style="italic">S</text>
<text x="87.4" y="254.0" font-size="19" fill="#111" text-anchor="middle" font-style="italic">C</text>
<text x="616.8" y="161.6" font-size="19" fill="#111" text-anchor="middle" font-style="italic">C</text>
<text x="390.8" y="331.0" font-size="18" fill="#111" text-anchor="middle">V</text>
<circle cx="448.0" cy="276.0" r="4.5" fill="#111"/>
<line x1="442.8" y1="278.2" x2="349.2" y2="298.0" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
<text x="343.2" y="298.0" font-size="15" fill="#111" text-anchor="end">S ∩ T</text>
<line x1="432.4" y1="361.8" x2="479.2" y2="401.4" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
<text x="485.2" y="401.4" font-size="18" fill="#1f7a3d" text-anchor="start" font-style="italic">C*</text>
<line x1="271.2" y1="168.2" x2="271.2" y2="234.2" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
<text x="271.2" y="157.2" font-size="15" fill="#c0392b" text-anchor="middle">被替换的边</text>
<text x="36" y="541" font-size="15" fill="#111">绿色 C*：把 C 中位于 T 内部的边换成 T 的其余三边</text>
<text x="36" y="563" font-size="15" fill="#111">S 与 T 只相交于一点，U 是 C 的、不含该点的那一侧</text>
</svg>
