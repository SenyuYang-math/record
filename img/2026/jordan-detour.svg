<path d="M 84.0 364.0 L 84.0 320.0 L 84.0 276.0 L 84.0 232.0 L 84.0 188.0 L 84.0 144.0 L 84.0 100.0 L 136.0 100.0 L 188.0 100.0 L 240.0 100.0 L 292.0 100.0 L 344.0 100.0 L 396.0 100.0 L 448.0 100.0 L 500.0 100.0 L 552.0 100.0 L 604.0 100.0 L 604.0 144.0 L 604.0 188.0 L 604.0 232.0 L 552.0 232.0 L 500.0 232.0 L 448.0 232.0 L 448.0 276.0 L 448.0 320.0 L 448.0 364.0 L 396.0 364.0 L 344.0 364.0 L 292.0 364.0 L 292.0 320.0 L 292.0 276.0 L 292.0 232.0 L 240.0 232.0 L 240.0 276.0 L 240.0 320.0 L 240.0 364.0 L 188.0 364.0 L 136.0 364.0 L 84.0 364.0" fill="none" stroke="#1f7a3d" stroke-width="5"/>
