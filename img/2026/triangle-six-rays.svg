<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="title desc">
  <title id="title">六条等测度射线与角度 φ</title>
  <desc id="desc">六条射线从 p 星点出发，将平面分成测度各为 μ(R²)/6 的扇区。R1 与 R4、R2 与 R5 分别反向；φ 表示 R3 与 R6 反向延长线之间的角。</desc>
  <rect width="780" height="520" fill="#fff"/>
  <text x="390" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" fill="#1f2937">六条等测度射线</text>
  <text x="390" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">每个扇区的测度为 μ(ℝ²)/6；图中夹角仅作示意</text>

  <g transform="translate(390 280)">
    <path d="M0 0 L108 0 A108 108 0 0 1 54 93.5 Z" fill="#dbeafe" opacity=".62"/>
    <path d="M0 0 L54 93.5 A108 108 0 0 1 -54 93.5 Z" fill="#e0f2fe" opacity=".62"/>
    <path d="M0 0 L-54 93.5 A108 108 0 0 1 -108 0 Z" fill="#dcfce7" opacity=".62"/>
    <path d="M0 0 L-108 0 A108 108 0 0 1 -54 -93.5 Z" fill="#fef3c7" opacity=".62"/>
    <path d="M0 0 L-54 -93.5 A108 108 0 0 1 37.1 -101.4 Z" fill="#ffedd5" opacity=".72"/>
    <path d="M0 0 L37.1 -101.4 A108 108 0 0 1 108 0 Z" fill="#f3e8ff" opacity=".68"/>

    <line x1="-235" y1="0" x2="235" y2="0" stroke="#2563a6" stroke-width="2.8"/>
    <line x1="-117.5" y1="-203.5" x2="117.5" y2="203.5" stroke="#4385a8" stroke-width="2.8"/>
    <line x1="-60" y1="29.7" x2="-180" y2="88.7" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>

    <line x1="0" y1="0" x2="220" y2="0" stroke="#2563a6" stroke-width="3.5"/>
    <line x1="0" y1="0" x2="110" y2="190.5" stroke="#4385a8" stroke-width="3.5"/>
    <line x1="0" y1="0" x2="-110" y2="190.5" stroke="#27845b" stroke-width="3.5"/>
    <line x1="0" y1="0" x2="-220" y2="0" stroke="#2563a6" stroke-width="3.5"/>
    <line x1="0" y1="0" x2="-110" y2="-190.5" stroke="#4385a8" stroke-width="3.5"/>
    <line x1="0" y1="0" x2="197.5" y2="-97.8" stroke="#b45309" stroke-width="3.5"/>

    <path d="M-24 41.6 A48 48 0 0 1 -43.1 21.2" fill="none" stroke="#b45309" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="5.5" fill="#111827"/>

    <g font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">
      <text x="91" y="42">μ/6</text>
      <text x="0" y="108">μ/6</text>
      <text x="-91" y="42">μ/6</text>
      <text x="-91" y="-42">μ/6</text>
      <text x="-9" y="-108">μ/6</text>
      <text x="99" y="-44">μ/6</text>
    </g>

    <g font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic">
      <text x="228" y="-10" fill="#1d4ed8">R₁</text>
      <text x="113" y="218" fill="#356b86">R₂</text>
      <text x="-128" y="218" fill="#27845b">R₃</text>
      <text x="-249" y="-10" fill="#1d4ed8">R₄</text>
      <text x="-127" y="-202" fill="#356b86">R₅</text>
      <text x="204" y="-112" fill="#b45309">R₆</text>
      <text x="-197" y="157" font-family="system-ui, sans-serif" font-size="13" font-style="normal" fill="#64748b">R₆ 的反向延长线</text>
      <text x="-45" y="52" fill="#b45309">φ</text>
      <text x="-7" y="28" fill="#111827">p*</text>
    </g>
    <text x="145" y="25" font-family="system-ui, sans-serif" font-size="13" fill="#2563a6">L(u)</text>
  </g>

  <text x="390" y="505" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">R₁ 与 R₄、R₂ 与 R₅ 分别组成直线；φ = 0 时第三对射线也组成直线</text>
</svg>
