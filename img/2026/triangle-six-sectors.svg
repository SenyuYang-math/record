<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">三条共点直线与六个扇区</title>
  <desc id="desc">三条直线交于点 p，六个点 x₁ 到 x₆ 分别位于六个连续扇区中.</desc>
  <rect width="760" height="470" fill="#fff"/>
  <g transform="translate(380 235)" stroke="#4a5568" stroke-width="3" stroke-linecap="round">
    <line x1="-320" y1="0" x2="320" y2="0"/>
    <line x1="-240" y1="210" x2="240" y2="-210"/>
    <line x1="-240" y1="-210" x2="240" y2="210"/>
  </g>
  <g fill="#2563a6" stroke="#fff" stroke-width="3">
    <circle cx="455" cy="124" r="9"/>
    <circle cx="560" cy="192" r="9"/>
    <circle cx="500" cy="326" r="9"/>
    <circle cx="305" cy="346" r="9"/>
    <circle cx="205" cy="260" r="9"/>
    <circle cx="270" cy="137" r="9"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#1f2937">
    <text x="470" y="112">x₁</text>
    <text x="580" y="190">x₂</text>
    <text x="515" y="350">x₃</text>
    <text x="278" y="376">x₄</text>
    <text x="170" y="270">x₅</text>
    <text x="235" y="125">x₆</text>
  </g>
  <circle cx="380" cy="235" r="7" fill="#111827"/>
  <text x="394" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#111827">p</text>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#64748b">
    <text x="469" y="58">S₁</text>
    <text x="625" y="142">S₂</text>
    <text x="595" y="365">S₃</text>
    <text x="274" y="432">S₄</text>
    <text x="86" y="330">S₅</text>
    <text x="118" y="120">S₆</text>
  </g>
</svg>
